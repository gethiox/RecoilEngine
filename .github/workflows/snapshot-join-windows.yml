# Builds Windows (and Linux) engine packages of the snapshot-join branch on
# regular GitHub-hosted runners, so the feature can be tested without the
# project's build infrastructure. The packages are uploaded as artifacts.
name: Snapshot join test build

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/jolly-hopper-dox24o'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [amd64-windows, amd64-linux]
    name: Build ${{ matrix.target }} engine
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # the engine version is derived from the history
          fetch-depth: 0
          submodules: recursive
          path: src
      - name: Build
        run: |
          source src/docker-build-v2/images_versions.sh
          image=ghcr.io/beyond-all-reason/recoil-build-${{ matrix.target }}@${image_version[${{ matrix.target }}]}
          docker pull "$image"

          # no shared compiler cache here
          echo "disable = true" > ccache.conf
          mkdir -p artifacts

          docker run -i --rm \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            --user="$(id -u):$(id -g)" \
            -v $(pwd)/src:/build/src:ro \
            -v $(pwd)/ccache.conf:/build/ccache.conf:ro \
            -v $(pwd)/artifacts:/build/artifacts:rw \
            "$image" \
            bash <<'BUILD'
          set -e
          cd /build/src/docker-build-v2/scripts
          ./configure.sh
          ./compile.sh
          ./split-debug-info.sh
          ./package.sh -snapshotjoin
          BUILD
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: recoil-snapshotjoin-${{ matrix.target }}
          path: ./artifacts
          compression-level: 0
